<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>眼部按摩跟练</title>
<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--ink:#2a2824;--mute:#756f63;--line:#e2d9c8;--accent:#c4452b;--accent-soft:#f6ddd4;--gold:#a8802e;--ok:#3d7a5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a17;--card:#262420;--ink:#efe9dc;--mute:#a59d8d;--line:#3a362f;--accent:#e8694c;--accent-soft:#4a2a22;--gold:#d3a955;--ok:#6fbf95}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.05em}
header .sub{color:var(--mute);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;max-width:1180px;margin:0 auto;padding:16px}
@media (max-width:820px){main{grid-template-columns:1fr;gap:14px}}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:start}
.stage svg{display:block;width:100%;height:auto;max-height:calc(100vh - 150px)}
.badge{position:absolute;left:12px;top:12px;background:rgba(20,18,15,.72);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.crumb{color:var(--gold);font-size:13px;letter-spacing:.1em}
h2{margin:2px 0 8px;font-size:26px;line-height:1.3;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px}
dt{color:var(--mute);font-size:13px;padding-top:3px;white-space:nowrap}
dd{margin:0}
.chant{text-align:center}
.phrases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.phrases span{padding:10px 0;border-radius:10px;white-space:nowrap;font-size:clamp(14px,2vw,22px);font-weight:600;color:var(--mute);background:transparent;border:1px solid var(--line);transition:all .15s}
.phrases span.on{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.04)}
.count{font-size:15px;color:var(--mute);min-height:1.6em}
.count b{font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:12px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold)}
.dots i.done{background:var(--gold)}
.ctrl{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}
.ctrl button{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 16px;font-size:16px}
.ctrl .main{background:var(--accent);color:#fff;border-color:var(--accent);padding:12px 24px;font-size:18px;font-weight:600;flex:1;max-width:200px}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--mute);align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg)}
.demo{display:flex;flex-direction:column;gap:10px}
.demo video{width:100%;aspect-ratio:5/4;border-radius:10px;display:block;background:#000;cursor:zoom-in}
.demo.big{position:fixed;inset:0;z-index:50;border-radius:0;border:0;background:rgba(15,13,10,.94);justify-content:center;align-items:center;padding:12px}
.demo.big video{width:min(100%,calc((100vh - 80px)*1.25));height:auto;cursor:zoom-out}
.demo.big p{color:#ddd}.demo.big a{display:none}
.demo p{margin:0;font-size:14px;color:var(--mute)}
.demo a{color:var(--accent)}
.prep ul{margin:6px 0 0;padding-left:1.2em}
.prep li{margin:3px 0}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
#list{position:fixed;inset:0 0 0 auto;width:min(360px,92vw);background:var(--card);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;overflow:auto;padding:14px 16px;z-index:5}
#list.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
#list h3{margin:14px 0 4px;font-size:13px;color:var(--gold);letter-spacing:.1em;font-weight:500}
#list button.item{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;font-size:15px}
#list button.item:hover{background:var(--bg)}
#list button.item.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
#list .n{color:var(--mute);font-variant-numeric:tabular-nums;width:1.6em;flex:none}
#list .r{margin-left:auto;color:var(--mute);font-size:12px;white-space:nowrap}
footer{max-width:1180px;margin:0 auto;padding:4px 16px 24px;color:var(--mute);font-size:12px}
/* markers */
.mk{fill:var(--accent);stroke:#fff;stroke-width:3}
.ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:.0}
.go .ring{animation:ring 1.07s ease-out infinite}
@keyframes ring{0%{opacity:.9;r:12px}100%{opacity:0;r:34px}}
.route{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;opacity:.75}
.route2{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 9}
.trail{stroke:#fff;stroke-width:3;stroke-dasharray:3 8;opacity:.85;stroke-linecap:round}
.sup{fill:rgba(255,255,255,.25);stroke:#fff;stroke-width:3;stroke-dasharray:5 4}
.tag{font-size:26px;font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:5px;stroke-linejoin:round}
.tag.dim{opacity:.6}
</style>
</head>
<body>
<header>
  <h1>眼部按摩跟练</h1>
  <span class="sub">依成观法师示范整理 · 共 <span id="total"></span> 个位置</span>
  <button class="ghost" id="btnList">全部步骤</button>
</header>
<div class="bar"><i id="prog"></i></div>
<main>
  <section class="stage">
    <svg id="svg" viewBox="230 130 540 800" role="img" aria-label="按摩位置图">
      <image id="face" href="img/face-front.jpg" width="1000" height="1339"/>
      <g id="marks"></g>
    </svg>
    <span class="badge" id="badge">位置图</span>
  </section>
  <section class="side">
    <div class="card" id="info">
      <div class="crumb" id="crumb">准备</div>
      <h2 id="title">开始之前</h2>
      <div id="body"></div>
    </div>
    <div class="card chant">
      <div class="phrases" id="phrases"></div>
      <div class="count" id="count">点「开始」后，跟着口令一边按一边念</div>
      <div class="dots" id="dots"></div>
      <div class="ctrl">
        <button id="prev" aria-label="上一步">‹ 上一步</button>
        <button class="main" id="play">开始</button>
        <button id="next" aria-label="下一步">下一步 ›</button>
      </div>
      <div class="opts">
        <span>每处遍数</span>
        <span class="seg" id="mult"><button data-m="1" class="on">法师示范 ×1</button><button data-m="2">×2</button><button data-m="3">×3</button></span>
        <label><input type="checkbox" id="auto" checked> 自动进入下一步</label>
      </div>
    </div>
    <div class="card demo" id="demo" hidden>
      <video id="clip" muted loop playsinline autoplay></video>
      <p>法师示范这一步（局部放大，无声循环）· 点一下录像可全屏放大<br><a id="orig" target="_blank" rel="noopener">打开原视频的这一段 ↗</a></p>
    </div>
  </section>
</main>
<footer>位置图为 Google Flow 生成的示意人像，标记点依法师的讲解和示范动作标定；细节以法师示范为准。按摩力度以酸胀可忍为度，眼睛红肿、发炎或有眼疾时请先就医。</footer>
<aside id="list" aria-label="全部步骤"></aside>

<script src="data.js"></script>
<script>
const D = window.DATA, S = D.steps, $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const VIEW = {front:{img:"img/face-front.jpg", vb:"230 130 540 800", name:"正面"}, side:{img:"img/face-side.jpg", vb:"140 110 760 1010", name:"侧面"}};
const ORIG = "../../Bandicut/" + encodeURIComponent("眼部按摩 .mp4");
let idx = -1, mult = 1, phase = "idle", rep = 0, reps = 0, running = false;
const speech = new Audio(), chant = new Audio("audio/mantra.mp3");
chant.preload = "auto";
let movers = [];

$("total").textContent = S.length;
$("phrases").innerHTML = D.mantra.map(p => `<span>${p}</span>`).join("");
const phraseEls = [...$("phrases").children];

function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); (parent||$("marks")).appendChild(e); return e; }

function drawMarks(s){
  const g = $("marks"); g.innerHTML = ""; movers = [];
  if(!s) return;
  (s.trail||[]).forEach(t => el("line", {x1:t[0],y1:t[1],x2:t[2],y2:t[3],class:"trail"}));
  (s.extra||[]).forEach(p => { el("circle", {cx:p[0],cy:p[1],r:15,class:"sup"}); });
  if(s.extra){ const p = s.extra[0]; const t = el("text", {x:p[0],y:p[1]+46,class:"tag dim","text-anchor":"middle"}); t.textContent = "拇指"; }
  (s.labels||[]).forEach(l => { const cur = s.pts && s.pts[0][0]===l[0] && s.pts[0][1]===l[1];
    if(!cur) el("circle", {cx:l[0],cy:l[1],r:7,fill:"#fff",opacity:.7});
    const t = el("text", {x:l[0]-22,y:l[1]+9,class:"tag"+(cur?"":" dim"),"text-anchor":"end"}); t.textContent = l[2]; });
  (s.paths||[]).forEach(d => {
    el("path", {d, class:"route"}); const p = el("path", {d, class:"route2"});
    const m = el("g", {}); el("circle", {r:12,class:"ring"}, m); el("circle", {r:12,class:"mk"}, m);
    movers.push({g:m, path:p, len:p.getTotalLength(), travel:s.travel||"updown"});
  });
  (s.pts||[]).forEach(pt => {
    const m = el("g", {}); el("circle", {r:12,class:"ring"}, m); el("circle", {r:12,class:"mk"}, m);
    movers.push({g:m, x:pt[0], y:pt[1], move:s.move, circle:s.circle});
  });
  place(0, 0);
}
// u: progress within one recitation 0..1 ; beat: 4 beats per recitation
function place(u, active){
  const ang = 2*Math.PI*u*4;
  for(const m of movers){
    let x, y;
    if(m.path){
      let k = m.travel==="down" ? u : 0.5-0.5*Math.cos(2*Math.PI*u*(m.travel==="pulse"?2:1));
      if(!active) k = 0;
      const p = m.path.getPointAtLength(k*m.len); x = p.x; y = p.y;
    } else if(m.circle){ x = m.x + (active? m.circle*Math.cos(ang):0); y = m.y + (active? m.circle*Math.sin(ang):0); }
    else { const a = active? Math.sin(ang):0; x = m.x + (m.move?m.move[0]:0)*a; y = m.y + (m.move?m.move[1]:0)*a; }
    m.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  }
}
function tick(){
  if(phase==="chant" && !chant.paused && chant.duration){
    const u = Math.min(chant.currentTime/chant.duration, .999);
    place(u, 1);
    const k = Math.floor(u*4); phraseEls.forEach((e,i)=>e.classList.toggle("on", i===k));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function render(){
  const s = S[idx];
  $("prog").style.width = (idx<0?0:(idx+ (phase==="done"?1:0))/S.length*100) + "%";
  phraseEls.forEach(e=>e.classList.remove("on"));
  if(idx < 0 || idx >= S.length){
    const end = idx >= S.length;
    $("crumb").textContent = end ? "圆满" : "准备";
    $("title").textContent = end ? "全部做完了" : "开始之前";
    $("body").innerHTML = end ? `<p>${D.outro.say}</p>` : `<div class="prep"><ul>${D.intro.points.map(p=>`<li>${p}</li>`).join("")}</ul></div>`;
    $("demo").hidden = true; drawMarks(null); setView("front"); $("badge").textContent = "位置图";
    $("dots").innerHTML = ""; if(!running) $("count").textContent = end ? "愿这双眼睛，转成菩提眼" : "点「开始」后，跟着口令一边按一边念";
  } else {
    $("crumb").textContent = `${s.sec} · 第 ${idx+1} / ${S.length} 步`;
    $("title").textContent = s.title;
    $("body").innerHTML = `<dl><dt>位置</dt><dd>${s.where}</dd><dt>手法</dt><dd>${s.how}</dd>${s.hand?`<dt>手型</dt><dd>${D.hands[s.hand]}</dd>`:""}</dl>`;
    setView(s.view, s); $("badge").textContent = VIEW[s.view].name + "位置图";
    drawMarks(s);
    $("demo").hidden = false; const v = $("clip"); v.poster = `clips/${s.id}.jpg`; v.src = `clips/${s.id}.mp4`; v.play().catch(()=>{});
    $("orig").href = ORIG + "#t=" + Math.max(0, s.t-5);
    if (location.protocol !== "file:") $("orig").style.display = "none"; // 原视频只在本机有
    reps = s.reps*mult; drawDots(0);
    if(!running) $("count").innerHTML = `这一处念 <b>${reps}</b> 遍`;
  }
  $("marks").classList.toggle("go", phase==="chant");
  [...document.querySelectorAll("#list .item")].forEach((b,i)=>b.classList.toggle("cur", i===idx));
  $("play").textContent = running ? "暂停" : (idx<0 ? "开始" : (idx>=S.length ? "再做一遍" : "继续"));
}
const ZOOM = {"眉与额":"270 270 460 430","眼眶":"270 300 460 400","内眼角":"270 330 460 400","鼻与颧":"270 350 460 400","口与颌":"250 480 500 460","耳":"400 470 500 460","颈":"230 560 540 500"};
function setView(v, s){ const f = $("face"); if(f.getAttribute("href")!==VIEW[v].img) f.setAttribute("href", VIEW[v].img); let vb = VIEW[v].vb; if(s){ if(s.id==="s25") vb = ZOOM["耳"]; else if(s.id==="s37") vb = "380 560 560 560"; else if(ZOOM[s.sec]) vb = ZOOM[s.sec]; }
  $("svg").setAttribute("viewBox", vb); }
function drawDots(done){ $("dots").innerHTML = Array.from({length:reps},(_,i)=>`<i class="${i<done?"done":""}"></i>`).join(""); }

function stopAudio(){ speech.pause(); chant.pause(); chant.currentTime = 0; }
function say(name, then){ phase = "say"; $("marks").classList.remove("go"); speech.src = `audio/${name}.mp3`; speech.onended = then; speech.play().catch(()=>{}); }
function startStep(){
  stopAudio(); rep = 0; phase = "say"; render();
  if(idx < 0){ $("count").textContent = "请听准备事项…"; say("intro", ()=>{ idx = 0; startStep(); }); return; }
  if(idx >= S.length){ running = false; phase = "done"; render(); speech.src = "audio/outro.mp3"; speech.onended = null; speech.play().catch(()=>{}); return; }
  $("count").textContent = "请听位置说明…";
  say(S[idx].id, ()=> setTimeout(()=>{ if(running && phase==="say") chantOnce(); }, 500));
}
function chantOnce(){
  phase = "chant"; $("marks").classList.add("go");
  $("count").innerHTML = `第 <b>${rep+1}</b> / ${reps} 遍`;
  chant.currentTime = 0; chant.play().catch(()=>{});
}
chant.onended = () => {
  rep++; drawDots(rep);
  if(rep < reps){ chantOnce(); return; }
  phase = "gap"; $("marks").classList.remove("go"); place(0,0); phraseEls.forEach(e=>e.classList.remove("on"));
  if($("auto").checked){ $("count").textContent = "好，换下一个位置"; setTimeout(()=>{ if(running && phase==="gap"){ idx++; startStep(); } }, 1200); }
  else { running = false; $("count").textContent = "这一处完成。点「继续」进入下一步"; idx++; phase = "idle"; render(); }
};
function toggle(){
  if(running){ running = false; speech.pause(); chant.pause(); render(); return; }
  running = true;
  if(idx >= S.length){ idx = -1; }
  if(phase==="say" && speech.src && speech.currentTime>0 && !speech.ended){ speech.play(); render(); }
  else if(phase==="chant"){ chant.play(); render(); }
  else startStep();
  if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{});
}
function go(i){ idx = Math.max(-1, Math.min(S.length, i)); stopAudio(); phase = "idle"; if(running) startStep(); else render(); }

$("play").onclick = toggle;
$("prev").onclick = () => go(idx-1);
$("next").onclick = () => go(idx+1);
$("mult").onclick = e => { const b = e.target.closest("button"); if(!b) return; mult = +b.dataset.m; [...$("mult").children].forEach(x=>x.classList.toggle("on", x===b));
  try{ localStorage.setItem("eye.mult", mult); }catch(_){}
  if(idx>=0 && idx<S.length){ reps = S[idx].reps*mult; drawDots(rep); if(phase==="chant") $("count").innerHTML = `第 <b>${Math.min(rep+1,reps)}</b> / ${reps} 遍`; else if(!running) $("count").innerHTML = `这一处念 <b>${reps}</b> 遍`; } };
try{ const m = +localStorage.getItem("eye.mult"); if(m>1){ mult = m; [...$("mult").children].forEach(x=>x.classList.toggle("on", +x.dataset.m===m)); } }catch(_){}
document.addEventListener("keydown", e => { if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); toggle(); } else if(e.key==="ArrowRight") go(idx+1); else if(e.key==="ArrowLeft") go(idx-1); else if(e.key==="Escape") $("list").classList.remove("open"); });

// step list
(function(){ let h = `<button class="ghost" id="closeList">关闭</button>`, sec = "";
  S.forEach((s,i)=>{ if(s.sec!==sec){ sec = s.sec; h += `<h3>${sec}</h3>`; } h += `<button class="item" data-i="${i}"><span class="n">${i+1}</span><span>${s.title}</span><span class="r">${s.reps} 遍</span></button>`; });
  $("list").innerHTML = h;
  $("list").onclick = e => { const b = e.target.closest(".item"); if(b){ go(+b.dataset.i); $("list").classList.remove("open"); } else if(e.target.id==="closeList") $("list").classList.remove("open"); };
  $("btnList").onclick = () => $("list").classList.toggle("open");
})();
render();
$("clip").onclick = () => $("demo").classList.toggle("big");
addEventListener("keydown", e => { if (e.key === "Escape") $("demo").classList.remove("big"); });
</script>
</body>
</html>
